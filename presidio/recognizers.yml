# Presidio recognizer registry — loaded via RECOGNIZER_REGISTRY_CONF_FILE.
#
# This file REPLACES Presidio's default recognizer set (it does not extend
# it), so every recognizer the pipeline needs is listed here. Only the
# pipeline's own types are loaded; src/pii/layers/presidio.ts also asks for
# exactly these types. Names come from spaCy NER (presidio/nlp.yml), not
# from this file. Natural-language dates ("April 5, 2026"), which Presidio's
# DateRecognizer misses, are handled by the regex layer (src/pii/layers/regex.ts).
#
# English only.

global_regex_flags: 26

supported_languages:
    - en

recognizers:
    - name: EmailRecognizer
      type: predefined
    - name: PhoneRecognizer
      type: predefined
    - name: CreditCardRecognizer
      type: predefined
      supported_languages:
          - language: en
            context: [credit, card, visa, mastercard, cc, amex, discover, jcb, diners, maestro, instapayment]
    - name: IbanRecognizer
      type: predefined
    - name: DateRecognizer
      type: predefined
    - name: UsSsnRecognizer
      type: predefined
      supported_languages:
          - en
      country_code: us
    - name: UsPassportRecognizer
      type: predefined
      supported_languages:
          - en
      country_code: us
    - name: UsLicenseRecognizer
      type: predefined
      supported_languages:
          - en
      country_code: us
