# The external review could not reproduce the evaluation and had no way to
# tell "you skipped uv sync" from "this does not work". That is what this
# exists to answer.
#
# Two jobs, because they cost very different amounts. The fast job loads no
# model weights at all -- every model-backed fixture is module-scoped and
# consumed only by slow-marked classes -- so it runs on every push in seconds.
# The corpus job downloads roughly a gigabyte of weights and is therefore
# scheduled, dispatched, or opted into per pull request with a label.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  fast:
    name: fast tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install from the lock file
        run: uv sync --frozen --all-groups

      - name: Fast tests
        # HF_HUB_OFFLINE asserts the claim rather than trusting it: if any
        # fast test starts reaching for weights, this fails instead of
        # silently turning a two-second check into a ten-minute one.
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run pytest -m "not slow" -q

      - name: Corpus label integrity
        run: uv run python tools/derive_gold_spans.py --check

      - name: Held-out pools are still disjoint
        run: uv run python tools/make_holdout.py --check

  corpus:
    name: corpus + held-out evaluation
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-corpus')
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync --frozen --all-groups

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pii/detector.py') }}

      - name: Fetch detector weights
        run: |
          uv run python -m spacy download en_core_web_lg
          uv run python -c "from pii.detector import GlinerDetector; GlinerDetector().model"

      - name: Full test suite
        run: uv run pytest -q

      - name: Score the corpus
        run: uv run python tools/evaluate.py --show-fp 0 --report

      - name: Score the held-out corpus
        # Reported, never gating: a holdout failure is information about
        # generalisation, and making it red invites someone to fix it by
        # editing the holdout, which is exactly what must not happen.
        continue-on-error: true
        run: uv run pytest -m holdout -q

      - name: Publish results
        if: always()
        run: |
          {
            echo '## Corpus evaluation'
            echo
            sed -n '1,40p' reports/evaluation_report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation
          # The markdown and JSON are masked by default; this uploads only
          # those two, never reports/sanitized/.
          path: |
            reports/evaluation_report.md
            reports/evaluation.json
          retention-days: 30
