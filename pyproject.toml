[project]
name = "de-identification-and-re-identification-implementation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmed Maher", email = "ahmedmaheraljwhry057@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gliner>=0.2.24",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.3",
    "spacy>=3.8.16",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
de-identification-and-re-identification-implementation = "de_identification_and_re_identification_implementation:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "psutil>=7.2.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: exercises the real NER models",
    "holdout: the held-out corpus; scored, never tuned against",
]
testpaths = ["tests"]
pythonpath = ["."]
